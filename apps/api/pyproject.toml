[project]
name = "respondly-api"
version = "0.1.0"
description = "Respondly API, modular FastAPI application"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "psycopg[binary]>=3.2.0",
    "pyjwt[crypto]>=2.10.0",
]

[project.scripts]
respondly-api = "respondly_api.main:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"
